<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioMet — CAD 亚型代谢分类器（Ridge 模型版）</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
            crossorigin="anonymous">
    </script>

    <style>
        :root {
            --primary: #0055A4;
            --primary-light: #e8f0fe;
            --primary-dark: #003d7a;
            --danger: #d93025;
            --danger-bg: #fce8e6;
            --success: #1b8a3d;
            --warning: #e6a817;
            --warning-bg: #fef7e0;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f4;
            --gray-200: #e9ecef;
            --gray-300: #dadce0;
            --gray-600: #5f6368;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius-sm: 10px;
            --radius: 16px;
            --transition: 0.25s ease;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
            background:linear-gradient(160deg,#eef4fb 0%,#e1ecf8 40%,#f0f5fa 100%);
            color:#1a1a1a;line-height:1.6;min-height:100vh;padding:24px 10px 40px;
        }
        .disclaimer{
            background:#fff3cd;color:#856404;text-align:center;padding:10px 20px;
            border-radius:8px;margin-bottom:20px;font-size:.88rem;max-width:1200px;
            margin-left:auto;margin-right:auto;box-shadow:var(--shadow-sm);border-left:4px solid var(--warning);
        }
        .container{max-width:1200px;margin:0 auto}
        .grid-2-unequal{
            display:grid;grid-template-columns:1fr 1fr;gap:20px;
        }
        .card{
            background:var(--white);border-radius:var(--radius);padding:24px;
            box-shadow:var(--shadow);margin-bottom:0;
        }
        .card h3{
            color:var(--primary);margin-bottom:18px;font-size:1.15rem;
            padding-bottom:10px;border-bottom:2px solid var(--primary-light);
            display:flex;align-items:center;gap:8px;
        }
        .card h4{color:var(--primary-dark);font-size:.95rem;margin-bottom:10px;margin-top:16px}
        .card h4:first-of-type{margin-top:0}

        .metabolic-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 12px}

        .form-group{margin-bottom:16px}
        .form-group label{
            display:block;font-size:.8rem;font-weight:600;color:#333;
            margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .form-group input,.form-group select{
            width:100%;padding:10px 14px;border:1.5px solid var(--gray-300);
            border-radius:var(--radius-sm);font-size:.93rem;transition:var(--transition);
            background:var(--gray-50);
        }
        .form-group input:focus,.form-group select:focus{
            outline:none;border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(0,85,164,0.12);background:white;
        }
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

        .btn{
            display:inline-block;background:var(--primary);color:white;border:none;
            padding:12px 24px;border-radius:12px;font-size:.93rem;font-weight:600;
            cursor:pointer;transition:var(--transition);text-align:center;
        }
        .btn:hover{background:#004080;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,85,164,0.35)}
        .btn-block{width:100%}

        .result-box{
            margin-top:16px;padding:18px;border-radius:var(--radius-sm);
            text-align:center;font-weight:600;font-size:.95rem;
        }
        .result-box.primary{
            background:var(--primary-light);color:var(--primary-dark);border:1px solid #b8d4f0;
        }
        .badge-outline{
            display:inline-block;font-size:.72rem;background:#f0f0f0;color:#666;
            padding:3px 8px;border-radius:4px;margin-left:6px;font-weight:400;
        }
        .chart-container-sm{position:relative;height:315px;width:100%}

        @media(max-width:800px){
            .grid-2-unequal{grid-template-columns:1fr}
            .metabolic-grid{grid-template-columns:1fr 1fr}
        }
        @media(max-width:480px){
            .form-row,.metabolic-grid{grid-template-columns:1fr}
            .card{padding:16px}
        }
    </style>
</head>
<body>

    <div class="disclaimer">
        ⚕️ <strong>本工具仅供研究使用，不构成临床决策依据。</strong>
        基于代谢生物标志物的 CAD 亚型聚类预测模型（CardioMet Ridge 回归）。
    </div>

    <div class="container">
        <div class="grid-2-unequal">

            <!-- 左侧：输入面板 -->
            <div class="card">
                <h3>🧬 CardioMet-CAD 亚型分类器 <span class="badge-outline">Ridge</span></h3>
                <p style="font-size:0.82rem;color:var(--gray-600);margin-bottom:16px;">
                    基于岭回归多分类模型的 CAD 亚型预测。输入以下指标进行风险评估。
                </p>
                <div class="form-row">
                    <div class="form-group">
                        <label>年龄（岁）</label>
                        <input type="number" id="cm_age" min="18" max="120" placeholder="62" value="62">
                    </div>
                    <div class="form-group">
                        <label>性别</label>
                        <select id="cm_sex">
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                </div>
                <h4>📐 代谢指标</h4>
                <div class="metabolic-grid">
                    <div class="form-group">
                        <label>FBG 空腹血糖 (mmol/L)</label>
                        <input type="number" id="cm_fbg" step="0.1" min="3" max="20" placeholder="5.6" value="5.6">
                    </div>
                    <div class="form-group">
                        <label>SBP 收缩压 (mmHg)</label>
                        <input type="number" id="cm_sbp" min="70" max="250" placeholder="130" value="130">
                    </div>
                    <div class="form-group">
                        <label>DBP 舒张压 (mmHg)</label>
                        <input type="number" id="cm_dbp" min="40" max="150" placeholder="85" value="85">
                    </div>
                    <div class="form-group">
                        <label>eGFR (mL/min/1.73m²)</label>
                        <input type="number" id="cm_egfr" min="5" max="150" placeholder="80" value="80">
                    </div>
                    <div class="form-group">
                        <label>TG 甘油三酯 (mmol/L)</label>
                        <input type="number" id="cm_tg" step="0.1" min="0.3" max="15" placeholder="2.3" value="2.3">
                    </div>
                    <div class="form-group">
                        <label>BMI (kg/m²)</label>
                        <input type="number" id="cm_bmi" step="0.1" min="15" max="60" placeholder="25.0" value="25.0">
                    </div>
                </div>
                <button class="btn btn-block" onclick="predictCluster()" style="margin-top:12px;">
                    🔬 执行预测
                </button>
            </div>

            <!-- 右侧：预测结果 -->
            <div class="card">
                <h3>📈 聚类预测结果</h3>
                <div id="predictionDisplay">
                    <div class="result-box primary">
                        <strong>请点击「执行预测」</strong>
                    </div>
                </div>

                <div class="chart-container-sm" style="margin-top:12px;">
                    <canvas id="clusterChart"></canvas>
                </div>
                
            </div>

        </div>
    </div>

    <script>
        // =====================================================
        // 🧬 CardioMet Ridge 回归模型参数（来自 R glmnet）
        // 训练日期：2026-04-16
        // =====================================================

        // 变量顺序：FBG, SBP, DBP, eGFR, TG, BMI
        const VARS = ["FBG", "SBP", "DBP", "eGFR", "TG", "BMI"];

        // 标准化参数（center 经确认为浮点零 ~1e-15，故省略；scale 已与 R .rds 核对一致）
        const SCALE = { FBG: 2.398623, SBP: 18.795520, DBP: 11.662964, eGFR: 14.797940, TG: 1.056237,
        BMI: 3.127758 };

        // 调整模型：每个代谢变量 ~ sex + age 的线性系数（✅ 已核对）
        const ADJUST = {
            FBG: { intercept: 5.86636774, sex: 0.07710406, age: 0.00450430 },
            SBP: { intercept: 118.6669739, sex: 2.9797760, age: 0.1873061 },
            DBP: { intercept: 93.4149071, sex: -0.8789321, age: -0.2549368 },
            eGFR: { intercept: 126.1876130, sex: 13.0952965, age: -0.8527355 },
            TG: { intercept: 2.62008049, sex: 0.13680066, age: -0.01864292 },
            BMI: { intercept: 30.46583428, sex: -0.18165567, age: -0.07259015 }
        };

        // Ridge 模型系数（4 类 × 7 参数：intercept + 6 个代谢变量）（✅ 已核对）
        const RIDGE_COEF = {
            MH: { intercept: 4.175313, FBG: -3.111170, SBP: -3.795522, DBP: -3.565924, eGFR: 3.104532,
            TG: -1.992770, BMI: -2.255173 },
            HG: { intercept: -5.2067175, FBG: 8.3151778, SBP: 0.2116864, DBP: 0.1482417, eGFR: 1.8224195,
                TG: 4.0755854, BMI: 0.2804512 },
            HT: { intercept: 3.4573591, FBG: -2.8000801, SBP: 3.8464759, DBP: 4.0959320, eGFR: 2.9767758,
            TG: -1.2914132, BMI: 0.9084103 },
            RI: { intercept: -2.4259545, FBG: -1.9039275, SBP: -0.2626408, DBP: -0.6782495, eGFR: -8.4037272,
                TG: -0.2914019, BMI: 0.5663119 }
        };

        // 亚型显示名称
        const CLUSTER_NAMES = {
            MH: "代谢健康型 (MH)",
            HG: "高血糖型 (HG)",
            HT: "高血压型 (HT)",
            RI: "肾功能损伤型 (RI)"
        };

        // 共享常量
        const CLASSES = ["MH", "HG", "HT", "RI"];
        const DEFAULTS = { age: 62, FBG: 5.6, SBP: 130, DBP: 85, eGFR: 80, TG: 2.3, BMI: 25.0 };

        // ==================== 核心预测函数 ====================
        function predictCluster() {
            // ---------- 第 0 步：读取输入 ----------
            const sex_str = document.getElementById("cm_sex").value;
            // 性别编码：男=1, 女=2（已与 R 训练数据核对一致）
            const sex = (sex_str === "男") ? 1 : 2;
            const age = parseInt(document.getElementById("cm_age").value, 10) || DEFAULTS.age;
            const raw = {
                FBG: parseFloat(document.getElementById("cm_fbg").value) || DEFAULTS.FBG,
                SBP: parseInt(document.getElementById("cm_sbp").value, 10) || DEFAULTS.SBP,
                DBP: parseInt(document.getElementById("cm_dbp").value, 10) || DEFAULTS.DBP,
                eGFR: parseFloat(document.getElementById("cm_egfr").value) || DEFAULTS.eGFR,
                TG: parseFloat(document.getElementById("cm_tg").value) || DEFAULTS.TG,
                BMI: parseFloat(document.getElementById("cm_bmi").value) || DEFAULTS.BMI
            };

            // ---------- 第 1 步：计算调整残差 + 第 2 步：标准化（合并在一个循环中） ----------
            const scaled = {};
            for (const v of VARS) {
                const adj = ADJUST[v];
                const predicted = adj.intercept + adj.sex * sex + adj.age * age;
                const resid = raw[v] - predicted;
                scaled[v] = resid / SCALE[v];
            }

            // ---------- 第 3 步：Ridge 线性预测 + Softmax ----------
            const scores = {};
            for (const cls of CLASSES) {
                const coef = RIDGE_COEF[cls];
                let score = coef.intercept;
                for (const v of VARS) {
                    score += coef[v] * scaled[v];
                }
                scores[cls] = score;
            }

            // Softmax 转换为概率（数值稳定版：减去最大值防溢出）
            const maxScore = Math.max(...Object.values(scores));
            let expSum = 0;
            const probsRaw = {};
            for (const cls of CLASSES) {
                probsRaw[cls] = Math.exp(scores[cls] - maxScore);
                expSum += probsRaw[cls];
            }

            // 百分比舍入，误差均摊到最大概率类别（而非固定 MH）
            const probs = {};
            for (const cls of CLASSES) {
                probs[cls] = Math.round((probsRaw[cls] / expSum) * 100);
            }
            const probSum = Object.values(probs).reduce((a, b) => a + b, 0);
            if (probSum !== 100) {
                // 找最大概率类别承担舍入误差
                const adjustCls = CLASSES.reduce((a, b) => probs[a] >= probs[b] ? a : b);
                probs[adjustCls] += (100 - probSum);
            }

            // 最高概率类别（用 >= 使平局时可预测地选后者）
            const predicted = CLASSES.reduce((a, b) => probs[a] >= probs[b] ? a : b);

            // ---------- 第 4 步：更新界面 ----------
            document.getElementById("predictionDisplay").innerHTML =
                '<div class="result-box primary"><strong>预测亚型：' + CLUSTER_NAMES[predicted] +
                '</strong></div>';

            // 渲染 Chart.js 条形图
            try {
                renderClusterChart(probs, predicted);
            } catch (e) {
                console.error("Chart render failed:", e);
            }
        }

        // ==================== Chart.js 条形图 ====================
        let clusterChart = null;

        // 共享图表配置
        const CHART_OPTIONS = {
            responsive: true, maintainAspectRatio: false, indexAxis: "y",
            plugins: { legend: { display: false } },
            layout: { padding: { right: 45 } },
            scales: {
                x: {
                    min: 0, max: 100,
                    ticks: { callback: v => v + "%" },
                    grid: { color: "#e8e8e8" }
                }
            }
        };

        // 百分比标签插件（模块级，从 chart.data 读取值，避免闭包捕获）
        const pctPlugin = {
            id: "pctLabels",
            afterDatasetsDraw(chart) {
                const { ctx } = chart;
                const meta = chart.getDatasetMeta(0);
                const ds = chart.data.datasets[0];
                if (!ds || !meta.data) return;
                ctx.save();
                ctx.font = "bold 12px -apple-system, sans-serif";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#333";
                ctx.textAlign = "left";
                meta.data.forEach((bar, i) => {
                    const v = ds.data[i];
                    if (v > 0) {
                        ctx.fillText(v + "%", bar.x + 6, bar.y);
                    }
                });
                ctx.restore();
            }
        };

        function renderClusterChart(probs, predicted) {
            if (typeof Chart === "undefined") {
                console.warn("Chart.js 未加载，无法渲染图表");
                return;
            }
            const ctx = document.getElementById("clusterChart");
            if (!ctx) return;

            const labels = CLASSES.map(c => CLUSTER_NAMES[c]);
            const values = probs ? CLASSES.map(c => probs[c]) : [0, 0, 0, 0];
            const bgColors = probs
                ? CLASSES.map(c => c === predicted ? "#0055A4" : "#b0c4de")
                : "#e0e0e0";

            if (clusterChart) {
                // 复用已有实例：就地更新数据并重绘
                clusterChart.data.labels = labels;
                clusterChart.data.datasets[0].data = values;
                clusterChart.data.datasets[0].backgroundColor = bgColors;
                clusterChart.update();
            } else {
                // 首次创建
                clusterChart = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [{ data: values, backgroundColor: bgColors, borderRadius: 6 }]
                    },
                    options: CHART_OPTIONS,
                    plugins: [pctPlugin]
                });
            }
        }

        // 页面加载时绘制空图表占位
        document.addEventListener("DOMContentLoaded", () => {
            try {
                renderClusterChart(null, null);
            } catch (e) {
                console.error("Initial chart render failed:", e);
            }
        });
    </script>
</body>
</html>
